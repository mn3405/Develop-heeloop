name: HeeloopPose
options:
  bundleIdPrefix: com.heeloop
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HeeloopPose:
    type: application
    platform: iOS
    sources:
      - path: HeeloopPose
    info:
      path: HeeloopPose/Info.plist
      properties:
        CFBundleDisplayName: Heeloop Pose
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 캡처한 포즈 이미지를 전용 앨범에 모으기 위해 사진 보관함에 접근합니다.
        NSPhotoLibraryAddUsageDescription: 캡처한 포즈 이미지를 전용 앨범에 저장합니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heeloop.pose
